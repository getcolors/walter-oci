# Desired state for the walter-oci development machine. Non-secret values only.
#
# Secrets arrive as COLORS_PAR_* environment variables from .envrc.private.
# Required here: COLORS_PAR_R2_ACCESS_KEY_ID and COLORS_PAR_R2_SECRET_ACCESS_KEY
# for the state backend. OCI itself needs none — it authenticates from the
# profile named below in ~/.oci/config.

# Names the work directory, the OpenTofu state keys, and the ~/.ssh/config Host
# alias — so this machine is `ssh walter-oci`.
#
# This value is the entire separation between this machine's state and
# once-colors', which shares the bucket below. NEVER export COLORS_PAR_PROFILE:
# walter refuses to start when it is set, precisely because one variable would
# otherwise point it at `once-colors/...tfstate`.
profile: walter-oci
workdir: .colors

provider-compute: oci
provider-backend: r2

# A development machine holds uncommitted work and the boot volume goes with it,
# so the guard stays on. Lift it for one intentional delete with
# COLORS_PAR_COMPUTE_PREVENT_DESTROY=false rather than editing this.
compute-prevent-destroy: true

# --- power ------------------------------------------------------------------
#
# `stop` and `start` never reach OpenTofu — no template declares a power state,
# so stopping the machine causes no drift. They drive the oci CLI, which needs
# OCI_CLI_AUTH=security_token (set in .envrc) and a live session token.
#
# Stopping stops the OCPU and memory meter. The 100 GB boot volume bills either
# way. VM.Standard.A2.Flex is a paid shape, so this genuinely saves money.
power-wait-seconds: 300

# Set from the first create, and re-read after every recreate — this names one
# instance, so a rebuilt machine leaves it pointing at a TERMINATED one. With it
# here, stop and start need no access to OpenTofu state at all, so a broken R2
# bucket cannot strand this machine running.
#
# Re-read it with `tofu output instance_id` in .colors/walter-oci/walter-compute/,
# passing the R2 keys in — walter hands them to every stage explicitly, but a
# bare tofu falls through the AWS SDK's default chain to ~/.aws/credentials and
# fails with "Credential access key has length 20, should be 32". See CLAUDE.md.
oci-instance-id: ocid1.instance.oc1.eu-frankfurt-1.antheljrl3n4evicvgbdqr7qzf5sf2a4nlofrlrpz5weqknxunz6svfkqecq

# --- oci --------------------------------------------------------------------
#
# Shared with once-colors deliberately: the same tenancy, the same subnet, the
# same availability domain and the same session. One `oci session refresh`
# serves both projects. The consequences, so they are stated rather than
# discovered: this machine inherits the production subnet's security list, and
# it can reach the website server over private IPs.
oci-config-file-profile: DEFAULT
oci-compartment-id: ocid1.tenancy.oc1..aaaaaaaabz6wkmand36zaln2wbyuqqflr2uzohoj3briepj4mfpohas2bxsq
oci-subnet-id: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaaeo3hhvldibbw42m6atn52izm6vmaxxcjbfm2fz7t3glvw3ovihta
# Sharing the subnet constrains the machine to the ADs it serves, so this is
# once-colors' value rather than a free choice.
oci-availability-domain: XquT:EU-FRANKFURT-1-AD-1

# Must differ from once-colors' `once`. OCI does not enforce unique display
# names, and two instances with one name is a console you cannot read.
oci-display-name: walter

oci-shape: VM.Standard.A2.Flex
# Deliberately larger than the website server (1 OCPU / 6 GB): this one compiles
# things. Separate files mean separate sizing — nothing is shared here.
oci-ocpus: 2
oci-memory-in-gbs: 12
oci-boot-volume-size-in-gbs: 100
oci-boot-volume-vpus-per-gb: 30

# Pinned from the first create, read back with
# `tofu state show oci_core_instance.ampere_vm` as source_id.
#
# Unset, the newest compatible Canonical image is used — a moving target, and
# the image id forces replacement. With compute-prevent-destroy true a later
# apply would then FAIL rather than destroy the machine: safe, and baffling if
# you do not know why. Pinned, an apply months from now still plans no changes.
#
# This is the same image once-colors runs, which is expected — same region, same
# Canonical family, and it was the newest when both were created.
oci-image-id: ocid1.image.oc1.eu-frankfurt-1.aaaaaaaal4itgbo25fulz7jbwyjdk2qc775l4npiqraf44ac62pf4iqfddsa

# Path to a public key, read by OpenTofu at plan time. Not key material.
oci-ssh-authorized-keys: ~/.ssh/id_ed25519.pub

# --- editor -----------------------------------------------------------------
#
# The remote playbook installs nix on every machine regardless. These two keys
# add Emacs on top of it and clone this configuration.
#
# An ssh:// URL rather than https:// on purpose: the clone rides the agent
# ~/.ssh/config forwards, so no private key is written to the machine and the
# checkout can push back — which is the point of a development machine.
#
# The clone happens once. A later create leaves an existing checkout alone, so
# uncommitted work on the machine survives; `git pull` there is the way to
# refresh it.
emacs-config-repo: git@github.com:amiorin/.emacs.d.git

# Not the default `~/.config/emacs`, so Emacs does not find it on its own —
# launch with `emacs --init-directory ~/.config/neoemacs`. This mirrors the path
# the configuration uses on this workstation.
emacs-config-dest: ~/.config/neoemacs

# --- toolchain ---------------------------------------------------------------
#
# Installed with `nix profile add` on top of the nix every walter machine gets.
# Names are nixpkgs attribute paths, resolved against `nixpkgs-unstable` — the
# same ref the terminfo and Emacs steps use.
#
# That ref is a channel branch, not a revision, so these track upstream: two
# creates months apart do not produce the same versions. That is deliberate for
# a development machine, and it is what makes asdf 0.20 reachable at all.
#
# This list is the machine's baseline, not an inventory of it. Anything
# installed by hand on the machine is invisible here and does not survive a
# delete; adding a name here is what makes it come back.
#
# `fish` lands on PATH only. Nothing here touches /etc/passwd, so it does not
# become the login shell — that would be a separate and more invasive change.
nix-packages:
  - asdf-vm
  - ripgrep
  - fd
  - fish
  - fzf
  - gh
  - caddy
  - awscli2
  - azure-cli
  - google-cloud-sdk
  - oci-cli
  # Required by dotfiles-repo below: the installer is a bb script, and walter
  # refuses to build without this beside it.
  - babashka
  - clojure
  # The six the dotfiles' own config.fish invokes at interactive startup. Absent,
  # fish still starts but prints a command-not-found for each on every shell.
  # They came from a hand-installed devbox on the workstation this configuration
  # was written on; here they are declared, so a recreated machine has them.
  - starship
  - zoxide
  - atuin
  - direnv
  - eza
  # Not needed at startup, but the profile's `zne` and `za` aliases and its
  # emacs.kdl layout are useless without it.
  - zellij
  # A C compiler, for what Emacs builds on the machine rather than what nix
  # ships it: native compilation, and any package with a C module — vterm,
  # tree-sitter grammars fetched by treesit-install-language-grammar. The Emacs
  # derivation does not carry one, so without this those fail at first use
  # rather than at provisioning time. vterm additionally wants cmake and
  # libtool; add them here if that module is enabled.
  - gcc
  # Per-project toolchains. `once`, `once-colors` and this project all describe
  # theirs in a devenv.nix rather than expecting things on PATH, so without this
  # the machine can check those repos out and not build them. Pairs with the
  # `direnv` above — devenv is what `direnv allow` actually loads there.
  - devenv
  # The three agent CLIs. `claude-code` is unfree in nixpkgs, where the other
  # two are not — the playbook's single `nix profile add` carries
  # NIXPKGS_ALLOW_UNFREE=1 and --impure for exactly this, which is what lets all
  # three resolve in one invocation. That relaxes the licence check for every
  # name in this list, not only this one.
  #
  # Attribute paths, not binary names: these ship `claude`, `codex` and `pi`.
  # Versions track nixpkgs-unstable like everything else here, so they lag the
  # vendors' own release channels and their self-updaters cannot write into the
  # read-only store. Moving one forward is a create, not an update on the
  # machine.
  - claude-code
  - codex
  - pi-coding-agent

# The login shell, resolved under ~/.nix-profile/bin — so it has to be one of the
# packages above, and walter refuses to build if it is not.
#
# Switching this is not just a passwd(5) write. nix reaches a login shell through
# /etc/profile.d/nix.sh, which is sh-only: fish does not read it, and a nix-built
# fish does not read /etc/fish/conf.d either, because its sysconfdir is inside
# the store. A fish login therefore starts with
# PATH=/run/current-system/sw/bin:/bin:/usr/bin and cannot find `nix` itself,
# which is a hole you cannot climb out of from inside that shell.
#
# So the playbook writes ~/.config/fish/conf.d/nix.fish — nix's own fish
# integration — before it changes the shell, and never the other way round.
#
# `ssh walter-oci <command>` still runs this shell. Anything scripted against
# this machine gets fish syntax, not bash.
login-shell: fish

# --- language runtimes -------------------------------------------------------
#
# asdf comes from nix-packages above; walter refuses to build without it there.
#
# nixpkgs-unstable ships asdf 0.20, the Go rewrite, so the playbook uses
# `asdf set --home`. 0.16 removed `asdf global` outright — it answers "invalid
# command provided" rather than warning — so a ref carrying 0.15 would need the
# playbook changed in the same commit.
#
# `plugin` is optional; asdf resolves a bare name against its own index. It is
# spelled out here because that is what asdf's own documentation does.
asdf-tools:
  - name: nodejs
    version: 24.18.1
    plugin: https://github.com/asdf-vm/asdf-nodejs.git

# Package managers enabled through Node's own corepack, which is why this needs
# the nodejs entry above rather than being a package in its own right.
#
# corepack installs its shims into that Node's bin directory, which asdf does
# not expose until `asdf reshim` — without it `corepack enable pnpm` succeeds
# and `pnpm` stays command-not-found. The playbook reshims; do not drop it.
#
# corepack downloads the package manager itself on first use, so the first
# `pnpm` is slow and needs a network. That is corepack's design.
corepack-packages:
  - pnpm

# --- dotfiles ----------------------------------------------------------------
#
# Cloned to the machine and applied to $HOME by the remote playbook's last two
# steps, after the shell and the editor the profile configures are already in
# place.
#
# ssh:// rather than https://, for the same reason emacs-config-repo above is:
# the clone rides the agent ~/.ssh/config forwards, so no private key lands on
# the machine and edits made there can be pushed back. A dotfiles checkout you
# cannot commit from is a checkout you stop editing.
#
# The cost is that create now needs your local agent to be holding the key —
# an https:// clone of this public repository would not. That is already true of
# the Emacs clone, so it adds no new failure mode.
dotfiles-repo: git@github.com:amiorin/dotfiles-v3

# Deliberately not the ~/code/personal/dotfiles-v3/main this configuration's
# workstation uses. That path is a hand-made layout predating walter; this one is
# walter's, and the two machines are not the same machine.
dotfiles-dest: ~/code/amiorin/dotfiles-v3

# Selects resources/stage-2/<profile>/ in the repository above. `macos` is the
# only other one it ships, and this machine is Ubuntu.
dotfiles-profile: ubuntu

# --- organisation checkouts ---------------------------------------------------
#
# Every source repository in this org, cloned to ~/code/getcolors/<repo> — the
# same layout this workstation uses, so a path that works here works there. That
# is what makes the machine able to work on the stack rather than merely able to
# compile it: fifteen checkouts, one of which is this file.
#
# Only the org is desired state. The list is read from GitHub's API on the
# machine at create time, so a sixteenth repository arrives on the next create
# with nothing to change here. Unauthenticated, which is exactly what the
# workspace's "every repo in the org is public" design already assumes — no
# token, and nothing private to miss.
#
# Runs after the dotfiles above, which write over $HOME, and before the atuin
# sync that stays last. It is the longest step in a create: fifteen clones over
# the forwarded agent.
#
# Rides that agent like the two clones above, so nothing writes a key to the
# machine and every checkout can push back — while your local agent holds the
# key. And clones once, for the same reason they do: a later create must not
# discard work done on the machine. `git pull` there is how one moves.
clone-orgs:
  - getcolors

# --- shell history -----------------------------------------------------------
#
# Adopts an existing atuin account, so a rebuilt machine can still see the
# history of the one it replaced. Runs after the dotfiles above, because they
# are what write ~/.config/atuin/config.toml.
#
# Only the username is here. The password and the encryption key are
# COLORS_PAR_ATUIN_PASSWORD and COLORS_PAR_ATUIN_KEY, set in the gitignored
# .envrc.private — this file is committed, and that key decrypts this account's
# history on every machine it is on. The remote playbook reads them from the
# environment at create time and refuses to run without them; `build` never
# needs them, which is why they are not checked at validation time.
#
# Logging in replaces whatever key atuin generated locally, so history written
# on the machine before the first create becomes unreadable. That is what
# adopting an existing account means, and it is why the login runs once —
# guarded by ~/.local/state/walter/atuin-<username>, a stamp walter writes,
# because atuin keeps its session in meta.db and offers no file to watch.
#
# `atuin sync` after it is not guarded, and runs on every create.
atuin-username: amiorin

# --- agent CLI credentials ---------------------------------------------------
#
# Carries this workstation's subscription logins to the machine, so the three
# CLIs above work there without a browser on it — the same problem the OCI
# session refresh solves with a port forward, avoided rather than solved.
#
# Only the agent names are desired state. Each resolves to exactly ONE file,
# named in walter's own registry and never editable from here:
#
#   claude  ~/.claude/.credentials.json
#   codex   ~/.codex/auth.json
#   pi      ~/.pi/agent/auth.json
#
# Deliberately not the directories. ~/.claude, ~/.codex and ~/.pi are ~279 MB on
# this workstation against ~9 KB of actual tokens, and nearly all the remainder
# is session transcripts — which have no business on a machine sitting in the
# production website's subnet.
#
# The files are read from this machine's home directory at create time and never
# rendered, so nothing under .colors/ ever holds a token and `build` still needs
# no credentials. A file that is not here is reported by name and skipped, so a
# create from anywhere else still succeeds with those CLIs logged out.
#
# It happens ONCE, guarded by `force: false` on the copy rather than by a stamp:
# these are OAuth refresh tokens the CLI rotates in place, and the credential
# file's own existence is the only guard that refuses both to overwrite a token
# the machine refreshed and to overwrite a login made on the machine directly.
# So this seeds an empty machine and never repairs one — when the machine's
# tokens expire, log in there, or delete the file there and create again.
#
# Two things worth knowing before adding a name here. Both machines then refresh
# against one refresh token, so a rotation on either can log the other out. And
# ~/.pi/agent/auth.json holds long-lived `deepseek` and `anthropic` API keys
# alongside its OAuth triple, which is a heavier thing to copy than a session.
seed-agent-credentials:
  - claude
  - codex
  - pi

# --- state backend ----------------------------------------------------------
#
# The same bucket once-colors uses. That is safe because the state key is
# <profile>/<stage>.tfstate and both halves differ: this writes
# walter-oci/walter-compute.tfstate, never once-colors/tofu-compute.tfstate.
r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
